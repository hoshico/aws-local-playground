version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_demo
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      # 起動するサービスをS3に限定
      - SERVICES=s3
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
